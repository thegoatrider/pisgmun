<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login — PMUN 2026</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="theme-light">

  <div id="demo-banner" class="demo-mode-badge" style="display: none;">
    Demo Mode Active — Running on Local Storage mock database.
  </div>

  <section class="auth-container">
    <div class="auth-card animate-fade-in">
      <div style="display:flex; justify-content:center; margin-bottom:1.5rem;">
        <img src="resources/podar_tree_logo.png" alt="Podar Logo" style="width: 64px; height: 64px; object-fit: contain;">
      </div>

      <h2 id="password-role-label">PORTAL ACCESS</h2>
      <p style="color:var(--color-text-muted); margin-bottom:2rem; font-size:0.95rem;">Enter the portal security password to log in.</p>

      <form id="password-form">
        <div class="form-group" style="text-align: left;">
          <label for="portal-password">Password</label>
          <input type="password" id="portal-password" class="input-field" placeholder="••••••••" required autofocus style="width: 100%;">
        </div>
        
        <p id="password-error" class="error-msg" style="display: none; margin-top: 1rem; color: var(--color-danger); font-size: 0.9rem; font-weight: 600;">
          Incorrect password. Please try again.
        </p>

        <button type="submit" class="btn-continue" style="width: 100%; margin-top: 1.5rem; justify-content: center;">
          <span id="btn-login-text">CONTINUE →</span>
          <span id="btn-login-spinner" class="spinner" style="display: none; margin-left: 0.5rem;"></span>
        </button>
      </form>

      <button id="btn-auth-back" class="btn-back" style="margin-top: 2rem; display: block; width: 100%; text-align: center; border: none; background: none; color: var(--color-navy); cursor: pointer; font-weight: 600;">
        ← Back to selection
      </button>
    </div>
  </section>

  <script src="supabase-client.js?v=4"></script>
  <script src="login.js?v=4"></script>
</body>
</html>
