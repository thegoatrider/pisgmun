<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Committee Details — PMUN 2026</title>
  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    .bg-sec-nav-btn {
      background-color: transparent;
      color: var(--color-navy);
      border: none;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }
    .bg-sec-nav-btn:hover {
      background-color: rgba(11, 60, 102, 0.05);
    }
    .active-bg-btn {
      background-color: var(--color-podar-blue) !important;
      color: var(--color-white) !important;
    }
  </style>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=4"></script>
  <script src="committee-detail.js?v=4"></script>
</head>
<body class="theme-light">

  <div id="demo-banner" class="demo-mode-badge" style="display: none;">
    Demo Mode Active — Running on Local Storage mock database.
  </div>

  <div class="delegate-layout" style="padding: 2rem; max-width: 1000px; margin: 0 auto;">
    
    <div id="grade-detail-container" class="tab-content active">
      <!-- RENDERED DYNAMICALLY BY SCRIPT -->
      <div style="text-align: center; padding: 4rem;">
        <span class="spinner" style="width: 48px; height: 48px; border-width: 4px;"></span>
        <p style="margin-top: 1rem; color: var(--color-text-muted);">Loading committee briefs...</p>
      </div>
    </div>

  </div>

  
</body>
</html>
